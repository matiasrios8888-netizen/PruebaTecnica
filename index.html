<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Permisos – Bprosys</title>
    <meta name="description" content="Solicitud y aprobación de permisos de los colaboradores." />
    <meta name="theme-color" content="#12345a" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- Tipografía: Atkinson Hyperlegible Next (Google Fonts). Si no carga, se usa la del sistema. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"

  <body>

    <!-- type="module" habilita import/export nativos del navegador (sin bundler) -->
    <script type="module" src="./src/main.js"></script>
  </body>
